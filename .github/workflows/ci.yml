name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Loopback aliases for the engine tests
        if: runner.os == 'macOS'
        run: |
          sudo ifconfig lo0 alias 127.0.0.2/32
          sudo ifconfig lo0 alias 127.0.0.3/32
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-build darwin/amd64
        if: runner.os == 'macOS'
        run: CGO_ENABLED=1 GOARCH=amd64 go build -o /dev/null ./cmd/net-merge
      - name: Cross-build linux/arm64
        if: runner.os == 'Linux'
        run: GOARCH=arm64 go build -o /dev/null ./cmd/net-merge

  # System-wide mode for real, as root: TUN, routes, balancing over two uplinks, off, kill -9.
  linux-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o net-merge ./cmd/net-merge
      - run: bash scripts/linux-e2e.sh ./net-merge
      - name: net-merge logs
        if: always()
        run: cat /tmp/net-merge-e2e/*.log 2>/dev/null || true

  # System-wide mode for real, as root: utun, routes, relaying, off, kill -9. One NIC, so no balancing.
  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o net-merge ./cmd/net-merge
      - run: bash scripts/macos-smoke.sh ./net-merge
      - name: net-merge logs
        if: always()
        run: cat /tmp/net-merge-smoke*.log 2>/dev/null || true

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build -L .#net-merge
      - run: nix flake check -L
