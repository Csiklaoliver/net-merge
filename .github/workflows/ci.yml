name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Loopback aliases for the engine tests
        if: runner.os == 'macOS'
        run: |
          sudo ifconfig lo0 alias 127.0.0.2/32
          sudo ifconfig lo0 alias 127.0.0.3/32
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-build darwin/amd64
        if: runner.os == 'macOS'
        run: CGO_ENABLED=1 GOARCH=amd64 go build -o /dev/null ./cmd/net-merge
      - name: Cross-build linux/arm64
        if: runner.os == 'Linux'
        run: GOARCH=arm64 go build -o /dev/null ./cmd/net-merge

  # System-wide mode for real, as root: TUN, routes, balancing over two uplinks, off, kill -9.
  linux-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o net-merge ./cmd/net-merge
      - run: bash scripts/linux-e2e.sh ./net-merge
      - name: net-merge logs
        if: always()
        run: cat /tmp/net-merge-e2e/*.log 2>/dev/null || true

  # System-wide mode for real, as root: utun, routes, relaying, off, kill -9. One NIC, so no balancing.
  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o net-merge ./cmd/net-merge
      - run: bash scripts/macos-smoke.sh ./net-merge
      - name: net-merge logs
        if: always()
        run: cat /tmp/net-merge-smoke*.log 2>/dev/null || true

  # The Linux packages and the apt/dnf repositories, tried for real: build them, serve them on
  # localhost, then install net-merge from them with apt here and with dnf in a Fedora container.
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils createrepo-c desktop-file-utils appstream rpm gnupg
      - name: Build the .deb and .rpm files
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -ldflags "-s -w -X main.version=0.0.0" -o net-merge ./cmd/net-merge
            for p in deb rpm; do VERSION=0.0.0 ARCH=$arch "$(go env GOPATH)/bin/nfpm" package -p $p -f packaging/nfpm.yaml -t dist/; done
            rm net-merge
          done
          ls -la dist
      - name: Validate the desktop and AppStream files
        run: |
          desktop-file-validate packaging/io.github.rohit267.net-merge.desktop
          appstreamcli validate --no-net packaging/io.github.rohit267.net-merge.metainfo.xml
      - name: Build signed repositories with a throwaway key
        run: |
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --passphrase '' --quick-generate-key 'net-merge CI <ci@example.invalid>' rsa3072 sign never
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          GPG_KEY_ID=$key REPO_BASE_URL=http://localhost:8000 scripts/build-repos.sh dist site
          python3 -m http.server 8000 --directory site >/dev/null 2>&1 &
          sleep 2
      - name: apt install net-merge
        run: |
          curl -fsS http://localhost:8000/apt/key.gpg | sudo tee /usr/share/keyrings/net-merge.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/net-merge.gpg] http://localhost:8000/apt stable main" | sudo tee /etc/apt/sources.list.d/net-merge.list
          sudo apt-get update
          sudo apt-get install -y net-merge
          getcap /usr/bin/net-merge | tee /dev/stderr | grep -q cap_net_admin
          net-merge version
          desktop-file-validate /usr/share/applications/io.github.rohit267.net-merge.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/net-merge.png
      - name: dnf install net-merge (Fedora)
        run: |
          docker run --rm --network host fedora:latest bash -ec '
            curl -fsS -o /etc/yum.repos.d/net-merge.repo http://localhost:8000/rpm/net-merge.repo
            dnf install -y net-merge
            rpm -q net-merge
            net-merge version'

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build -L .#net-merge
      - run: nix flake check -L
